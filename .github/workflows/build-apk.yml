name: GitDesk · Android 构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 云端编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像已预装 Android SDK，这里只补齐需要的组件。
      # 不用 android-actions/setup-android：它内部执行 `sdkmanager tools`，
      # 而该包已从官方仓库移除，会直接报 "Failed to find package 'tools'"。
      - name: 准备 Android SDK
        run: |
          set -eo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 构建 Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: GitDesk-Android-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
