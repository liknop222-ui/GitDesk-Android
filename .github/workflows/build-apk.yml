name: GitDesk · Android 构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 云端编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 构建 Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: GitDesk-Android-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
