name: GitDesk · Flutter 构建

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 项目根目录（含 pubspec.yaml 的目录；就在仓库根目录时填 .）
        required: false
        default: .
      build_mode:
        description: 构建模式
        type: choice
        options:
          - release
          - debug
        default: release
      use_mirror:
        description: 使用国内镜像加速依赖下载
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'yes'

permissions:
  contents: read

jobs:
  build:
    name: 云端编译
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 启用依赖镜像加速
        if: ${{ inputs.use_mirror == 'yes' }}
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> "$GITHUB_ENV"
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> "$GITHUB_ENV"
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE'
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                  }
              }
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  mavenCentral()
                  google()
              }
          }
          GRADLE
          echo "Flutter 与 Gradle 镜像已启用"

      - name: 执行构建
        run: |
          cd "${{ inputs.project_dir }}"
          flutter pub get
          flutter build apk --${{ inputs.build_mode }}

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: gitdesk-flutter-apk
          path: |
            **/build/app/outputs/flutter-apk/*.apk
            **/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
